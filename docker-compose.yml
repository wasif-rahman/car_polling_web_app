services:
  # 3. Data Tier (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: carpool-db
    restart: always
    environment:
      POSTGRES_USER: carpool_user
      POSTGRES_PASSWORD: super_secure_password
      POSTGRES_DB: carpool_db
    ports:
      - "5432:5432" # Accessible locally for debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Application Tier (Next.js Node app)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carpool-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://carpool_user:super_secure_password@db:5432/carpool_db?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_KEY=${PUSHER_KEY}
      - PUSHER_SECRET=${PUSHER_SECRET}
      - NEXT_PUBLIC_PUSHER_KEY=${NEXT_PUBLIC_PUSHER_KEY}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - NEXT_PUBLIC_OPENROUTESERVICE_API_KEY=${NEXT_PUBLIC_OPENROUTESERVICE_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data:
